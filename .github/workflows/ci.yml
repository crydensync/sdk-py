name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-smoketest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: api
          POSTGRES_PASSWORD: api_test
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Python SDK
        uses: actions/checkout@v4
        with:
          path: sdk-py

      - name: Checkout CSAG API
        uses: actions/checkout@v4
        with:
          repository: crydensync/csag
          path: api

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run API migrations
        run: |
          for migration in migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
        working-directory: api
        env:
          DATABASE_URL: postgres://api:api_test@localhost:5432/api_test?sslmode=disable

      - name: Start API server
        run: |
          go build -o api_server .
          ./api_server &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"
          exit 1
        working-directory: api
        env:
          DATABASE_URL: postgres://api:api_test@localhost:5432/api_test?sslmode=disable
          JWT_SECRET: ci-test-secret-not-for-prod
          CORS_ORIGINS: http://localhost:5173
          PORT: 8080

      - name: Install SDK and build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
          python -m build
        working-directory: sdk-py

      - name: Run smoke test against the live API
        run: python smoketest.py http://localhost:8080
        working-directory: sdk-py
